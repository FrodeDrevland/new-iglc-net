## SWAG proxy config for the conference sites on the preview: https://conference.iglc.drevland.net
## Same container as iglc.subdomain.conf; Django tells the sites apart by the host name.
## Copy to /config/nginx/proxy-confs/ in the SWAG appdata folder and restart SWAG.

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name conference.iglc.*;

    include /config/nginx/ssl.conf;

    client_max_body_size 50m;

    # Preview only: password-protected (same login as the main preview) and not indexed.
    auth_basic "IGLC preview";
    auth_basic_user_file /config/nginx/.htpasswd-iglc;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app iglc-web;
        set $upstream_port 8000;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }
}
