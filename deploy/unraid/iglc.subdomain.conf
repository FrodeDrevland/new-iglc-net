## SWAG proxy config for the iglc.net preview at https://iglc.drevland.net
## Copy to /config/nginx/proxy-confs/ in the SWAG appdata folder and restart SWAG.

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name iglc.*;

    include /config/nginx/ssl.conf;

    client_max_body_size 50m;

    # Preview only: password-protected and not indexed by search engines.
    auth_basic "IGLC preview";
    auth_basic_user_file /config/nginx/.htpasswd-iglc;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app iglc-web;
        set $upstream_port 8000;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }
}
