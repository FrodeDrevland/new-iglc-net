# Local development: docker compose up, then open http://localhost:8000
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: iglc
      POSTGRES_USER: iglc
      POSTGRES_PASSWORD: iglc
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    env_file: .env
    environment:
      DATABASE_URL: postgres://iglc:iglc@db:5432/iglc
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  pgdata:
