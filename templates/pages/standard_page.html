{% extends "base.html" %}
{% load wagtailcore_tags %}
{% block title %}{{ page.seo_title|default:page.title }}{% endblock %}
{% block content %}
<article>
  <h1>{{ page.title }}</h1>
  {% if page.intro %}<p class="lead">{{ page.intro }}</p>{% endif %}
  {{ page.body|richtext }}
</article>
{% endblock %}
